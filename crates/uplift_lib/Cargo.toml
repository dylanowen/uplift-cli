[package]
name = "uplift-lib"
version = "0.0.1"
authors = ["Dylan Owen <dyltotheo@gmail.com>"]
description = ""
readme = "Readme.md"
license = "MPL-2.0"
homepage = "https://github.com/dylanowen/uplift-cli"
repository = "https://github.com/dylanowen/uplift-cli"
edition = "2021"

[lib]

[features]
serde = ["dep:serde", "btleplug/serde"]
sqlx = ["dep:sqlx", "dep:rmp-serde", "serde"]

[dependencies]
log = "0.4.21"

# async
tokio = { version = "1.37", features = ["macros", "sync", "time"] }
tokio-stream = "0.1"
futures = "0.3.30"

# Bluetooth support
btleplug = "0.11.5"
uuid = "1.8"

nom = "8"

#autoconver
#uom.version = "0.36"
#uom = { version = "0.36", default-features = false, features = ["autoconvert", "usize", "f32", "si", "std", "serde"] }
uom = { version = "0.36", default-features = false, features = ["f32", "si", "std"] }

serde = { version = "1.0", features = ["derive"], default-features = false, optional = true }
sqlx = { version = "0.8", path = "../../../sqlx", default-features = false, optional = true }
rmp-serde = { version = "1.3", optional = true }

either = "1.13"

[dev-dependencies]
async-trait = "0.1"
mockall = "0.13"
tokio = { version = "1.37", features = ["rt-multi-thread"] }